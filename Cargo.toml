[package]
name = "lazydot"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A lazygit-style TUI for your dotfiles: discover, adopt, symlink and restore configs safely. GNU Stow compatible."
license = "MIT"
repository = "https://github.com/itxmjr/LazyDot"
readme = "README.md"
keywords = ["tui", "dotfiles", "stow", "symlink", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/assets"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
